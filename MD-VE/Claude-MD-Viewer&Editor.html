<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>마크다운 에디터</title>
<meta name="description" content="설치나 인터넷 연결 없이 브라우저에서 바로 실행되는 오프라인 Markdown 뷰어 겸 에디터입니다.">
<style>
/* ==========================================================================
   마크다운 에디터 - 스타일시트
   구성 순서: 1.디자인 토큰 2.리셋 3.레이아웃 4.툴바 5.분할영역/디바이더
             6.Viewer 타이포그래피 7.Editor 8.상태바 9.모달/토스트
             10.접근성 11.반응형(모바일)
   ========================================================================== */

/* -----------------------------------------------------------------------
   1. 디자인 토큰 (라이트 모드 기본값 + 다크 모드 오버라이드)
   ----------------------------------------------------------------------- */
:root {
  --bg-app: #F5F5F7;
  --bg-surface: #FFFFFF;
  --bg-editor: #FBFBFA;
  --bg-hover: #F0F0F3;
  --bg-active: #E8E8ED;

  --border: #E3E3E8;
  --border-strong: #D2D2D9;

  --text-primary: #1C1C1F;
  --text-secondary: #6B6B74;
  --text-tertiary: #9C9CA4;
  --text-on-accent: #FFFFFF;

  --accent: #5B5FD6;
  --accent-hover: #4A4EC2;
  --accent-soft: #EDEDFB;

  --success: #2E8B57;
  --success-soft: #E7F5EE;
  --warn: #B4791F;
  --warn-soft: #FBF1E1;
  --danger: #C0392B;
  --danger-soft: #FBEAE8;

  --code-bg: #F0F0F4;
  --code-text: #B23A72;
  --quote-bar: #D6D6E0;
  --link: #4548B8;

  --shadow-sm: 0 1px 2px rgba(24, 24, 34, 0.06);
  --shadow-md: 0 4px 16px rgba(24, 24, 34, 0.10);
  --shadow-modal: 0 16px 48px rgba(20, 20, 30, 0.20), 0 4px 12px rgba(20, 20, 30, 0.10);

  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
             "Malgun Gothic", "맑은 고딕", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "D2Coding", "Cascadia Code", "Consolas",
               "Menlo", "Liberation Mono", monospace;

  --radius-sm: 5px;
  --radius-md: 9px;
  --radius-lg: 14px;

  --toolbar-h: 54px;
  --statusbar-h: 32px;
  --divider-size: 9px;

  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --t-fast: 110ms var(--ease);
  --t-base: 180ms var(--ease);

  color-scheme: light;
}

[data-theme="dark"] {
  --bg-app: #1B1C1F;
  --bg-surface: #222327;
  --bg-editor: #1E1F22;
  --bg-hover: #2B2C31;
  --bg-active: #333439;

  --border: #35363C;
  --border-strong: #45464D;

  --text-primary: #EDEDEF;
  --text-secondary: #A3A3AC;
  --text-tertiary: #77777F;
  --text-on-accent: #FFFFFF;

  --accent: #9294EE;
  --accent-hover: #A5A7F2;
  --accent-soft: #2A2B4A;

  --success: #74C69D;
  --success-soft: #1D3327;
  --warn: #E5AC6A;
  --warn-soft: #3B2D18;
  --danger: #E5766B;
  --danger-soft: #3B2320;

  --code-bg: #292A2F;
  --code-text: #E191B5;
  --quote-bar: #45464D;
  --link: #A9ABF5;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35);
  --shadow-modal: 0 16px 48px rgba(0, 0, 0, 0.55), 0 4px 12px rgba(0, 0, 0, 0.3);

  color-scheme: dark;
}

/* -----------------------------------------------------------------------
   2. 리셋 / 베이스
   ----------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family: var(--font-ui);
  font-size: 14px;
  color: var(--text-primary);
  background: var(--bg-app);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

button {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  cursor: pointer;
}

input, textarea {
  font-family: inherit;
  color: inherit;
}

h1, h2, h3, p { margin: 0; }

svg { display: block; }

/* 스크롤바 (웹킷 계열, 미니멀 톤) */
.scroll-area::-webkit-scrollbar { width: 11px; height: 11px; }
.scroll-area::-webkit-scrollbar-track { background: transparent; }
.scroll-area::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 999px;
  border: 3px solid var(--bg-surface);
}
.scroll-area::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* 공통 포커스 스타일 (키보드 접근성) */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* -----------------------------------------------------------------------
   3. 앱 레이아웃 (전체 골격)
   ----------------------------------------------------------------------- */
#app {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg-app);
}

/* -----------------------------------------------------------------------
   4. 툴바
   ----------------------------------------------------------------------- */
.toolbar {
  flex: 0 0 var(--toolbar-h);
  height: var(--toolbar-h);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 10px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
}
.toolbar::-webkit-scrollbar { display: none; }

.toolbar-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-right: 10px;
  margin-right: 6px;
  border-right: 1px solid var(--border);
  flex: 0 0 auto;
  white-space: nowrap;
}
.toolbar-brand-mark {
  width: 22px; height: 22px;
  border-radius: 6px;
  background: linear-gradient(155deg, var(--accent), var(--link));
  flex: 0 0 auto;
}
.toolbar-brand-name {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text-primary);
}

.toolbar-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 0 0 auto;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 11px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast);
}
.btn:hover { background: var(--bg-hover); }
.btn:active { background: var(--bg-active); }
.btn svg { width: 16px; height: 16px; flex: 0 0 auto; }
.btn-label { line-height: 1; }

.btn-primary {
  background: var(--accent);
  color: var(--text-on-accent);
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { background: var(--accent-hover); filter: brightness(0.94); }

.btn-ghost-icon {
  width: 34px;
  height: 34px;
  padding: 0;
  justify-content: center;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
}
.btn-ghost-icon:hover { background: var(--bg-hover); color: var(--text-primary); }

.toolbar-spacer { flex: 1 1 auto; min-width: 8px; }

.toolbar-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 8px;
  flex: 0 1 auto;
  min-width: 0;
}

.filename-display {
  display: flex;
  align-items: baseline;
  gap: 6px;
  min-width: 0;
  font-size: 13px;
  color: var(--text-primary);
}
.filename-text {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 260px;
}

.save-status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex: 0 0 auto;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  white-space: nowrap;
}
.save-status-dot {
  width: 7px; height: 7px;
  border-radius: 999px;
  background: var(--text-tertiary);
  transition: background var(--t-base);
}
.save-status[data-state="saved"] { color: var(--success); }
.save-status[data-state="saved"] .save-status-dot { background: var(--success); }
.save-status[data-state="dirty"] { color: var(--warn); }
.save-status[data-state="dirty"] .save-status-dot { background: var(--warn); }

/* -----------------------------------------------------------------------
   5. 분할 영역 / 디바이더
   ----------------------------------------------------------------------- */
.split-container {
  flex: 1 1 auto;
  display: flex;
  flex-direction: row;
  min-height: 0;
  min-width: 0;
}

.pane {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.viewer-pane {
  background: var(--bg-surface);
}

.editor-pane {
  background: var(--bg-editor);
}

.pane-scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  min-height: 0;
}

.divider {
  flex: 0 0 var(--divider-size);
  width: var(--divider-size);
  position: relative;
  cursor: col-resize;
  background: transparent;
  touch-action: none;
}
.divider::before {
  content: "";
  position: absolute;
  top: 0; bottom: 0;
  left: 50%;
  width: 1px;
  transform: translateX(-50%);
  background: var(--border);
  transition: background var(--t-fast), width var(--t-fast);
}
.divider:hover::before,
.divider:focus-visible::before,
.divider.is-dragging::before {
  width: 3px;
  background: var(--accent);
}
.divider:focus-visible {
  outline: none;
}
.divider:focus-visible::before {
  width: 3px;
}

/* -----------------------------------------------------------------------
   6. Viewer 타이포그래피
   ----------------------------------------------------------------------- */
.viewer-content {
  padding: 40px clamp(20px, 6%, 64px);
  max-width: 800px;
  margin: 0 auto;
  font-size: 15.5px;
  line-height: 1.75;
  color: var(--text-primary);
}

.viewer-content h1, .viewer-content h2, .viewer-content h3,
.viewer-content h4, .viewer-content h5, .viewer-content h6 {
  font-weight: 700;
  letter-spacing: -0.015em;
  line-height: 1.35;
  margin: 1.6em 0 0.6em;
}
.viewer-content h1:first-child, .viewer-content h2:first-child { margin-top: 0; }
.viewer-content h1 { font-size: 1.9em; padding-bottom: 0.35em; border-bottom: 1px solid var(--border); }
.viewer-content h2 { font-size: 1.5em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border); }
.viewer-content h3 { font-size: 1.25em; }
.viewer-content h4 { font-size: 1.08em; }
.viewer-content h5, .viewer-content h6 { font-size: 1em; color: var(--text-secondary); }

.viewer-content p { margin: 0.9em 0; }

.viewer-content strong { font-weight: 700; }
.viewer-content em { font-style: italic; }
.viewer-content del { color: var(--text-secondary); }

.viewer-content a {
  color: var(--link);
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--link) 40%, transparent);
  text-underline-offset: 2px;
}
.viewer-content a:hover { text-decoration-color: var(--link); }

.viewer-content ul, .viewer-content ol {
  margin: 0.9em 0;
  padding-left: 1.5em;
}
.viewer-content li { margin: 0.3em 0; }
.viewer-content li > ul, .viewer-content li > ol { margin: 0.3em 0; }
.viewer-content li input[type="checkbox"] {
  margin-right: 0.5em;
}

.viewer-content blockquote {
  margin: 1em 0;
  padding: 0.2em 1em;
  border-left: 3px solid var(--quote-bar);
  color: var(--text-secondary);
}
.viewer-content blockquote p { margin: 0.6em 0; }

.viewer-content code {
  font-family: var(--font-mono);
  font-size: 0.86em;
  background: var(--code-bg);
  color: var(--code-text);
  padding: 0.15em 0.4em;
  border-radius: 4px;
}

.viewer-content pre {
  margin: 1.1em 0;
  padding: 14px 16px;
  background: var(--code-bg);
  border-radius: var(--radius-md);
  overflow-x: auto;
}
.viewer-content pre code {
  background: none;
  padding: 0;
  color: var(--text-primary);
  font-size: 0.85em;
  line-height: 1.6;
}

.viewer-content hr {
  margin: 2em 0;
  border: none;
  border-top: 1px solid var(--border);
}

.viewer-content table {
  border-collapse: collapse;
  margin: 1.1em 0;
  width: 100%;
  font-size: 0.92em;
}
.viewer-content th, .viewer-content td {
  border: 1px solid var(--border);
  padding: 7px 12px;
  text-align: left;
}
.viewer-content th {
  background: var(--bg-hover);
  font-weight: 600;
}
.viewer-content img { max-width: 100%; border-radius: var(--radius-sm); }

/* Viewer 빈 상태 (안내 화면) */
.viewer-empty-guide {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}
.viewer-empty-guide-inner {
  max-width: 380px;
  text-align: center;
}
.viewer-empty-guide-icon {
  width: 52px; height: 52px;
  margin: 0 auto 18px;
  color: var(--text-tertiary);
}
.viewer-empty-guide h2 {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text-primary);
}
.viewer-empty-guide p {
  font-size: 13px;
  line-height: 1.7;
  color: var(--text-secondary);
  margin-bottom: 18px;
}
.viewer-empty-guide-shortcuts {
  display: inline-flex;
  flex-direction: column;
  gap: 6px;
  text-align: left;
  font-size: 12.5px;
  color: var(--text-secondary);
}
.viewer-empty-guide-shortcuts div { display: flex; align-items: center; gap: 8px; }
kbd {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--bg-hover);
  border: 1px solid var(--border-strong);
  box-shadow: 0 1px 0 var(--border-strong);
  color: var(--text-primary);
}

/* -----------------------------------------------------------------------
   7. Editor
   ----------------------------------------------------------------------- */
.editor-textarea {
  flex: 1 1 auto;
  width: 100%;
  height: 100%;
  resize: none;
  border: none;
  padding: 24px 26px;
  background: transparent;
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 14px;
  line-height: 1.7;
  tab-size: 2;
  -moz-tab-size: 2;
  overflow-y: auto;
}
.editor-textarea::placeholder { color: var(--text-tertiary); }
.editor-textarea:focus-visible {
  outline: none;
  box-shadow: inset 0 0 0 2px var(--accent-soft);
}

.pane-header {
  flex: 0 0 auto;
  height: 30px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  border-bottom: 1px solid var(--border);
}

/* -----------------------------------------------------------------------
   8. 상태바
   ----------------------------------------------------------------------- */
.statusbar {
  flex: 0 0 var(--statusbar-h);
  height: var(--statusbar-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 14px;
  background: var(--bg-surface);
  border-top: 1px solid var(--border);
  font-size: 11.5px;
  color: var(--text-secondary);
}
.status-message {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: color var(--t-base);
}
.status-message[data-type="success"] { color: var(--success); }
.status-message[data-type="error"] { color: var(--danger); }
.status-message[data-type="info"] { color: var(--text-secondary); }
.doc-info {
  flex: 0 0 auto;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* -----------------------------------------------------------------------
   9. 모달 / 토스트
   ----------------------------------------------------------------------- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 15, 20, 0.42);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--t-base);
}
.modal-overlay.is-open {
  opacity: 1;
  visibility: visible;
}
[data-theme="dark"] .modal-overlay { background: rgba(0, 0, 0, 0.6); }

.modal {
  width: 100%;
  max-width: 380px;
  background: var(--bg-surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-modal);
  padding: 22px 22px 18px;
  transform: translateY(6px) scale(0.98);
  transition: transform var(--t-base);
}
.modal-overlay.is-open .modal { transform: translateY(0) scale(1); }

.modal h2 {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 8px;
}
.modal p {
  font-size: 13px;
  line-height: 1.6;
  color: var(--text-secondary);
}
.modal-input-wrap { margin-top: 14px; }
.modal-input-wrap label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.modal-input {
  width: 100%;
  height: 38px;
  padding: 0 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--bg-app);
  color: var(--text-primary);
  font-size: 13.5px;
}
.modal-input:focus-visible {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}
.modal-actions .btn { height: 36px; }

.toast-region {
  position: fixed;
  left: 50%;
  bottom: calc(var(--statusbar-h) + 16px);
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  z-index: 200;
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: 999px;
  background: var(--text-primary);
  color: var(--bg-surface);
  font-size: 12.5px;
  font-weight: 600;
  box-shadow: var(--shadow-md);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity var(--t-base), transform var(--t-base);
}
.toast.is-visible { opacity: 1; transform: translateY(0); }
.toast[data-type="error"] { background: var(--danger); color: #fff; }
.toast[data-type="success"] { background: var(--success); color: #fff; }

/* -----------------------------------------------------------------------
   10. 접근성 보조
   ----------------------------------------------------------------------- */
.hidden { display: none !important; }

/* -----------------------------------------------------------------------
   11. 반응형 (태블릿 / 모바일)
   ----------------------------------------------------------------------- */
@media (max-width: 860px) {
  .filename-text { max-width: 140px; }
  .toolbar-brand-name { display: none; }
}

@media (max-width: 768px) {
  body { font-size: 13.5px; }

  .split-container.is-stacked {
    flex-direction: column;
  }
  .split-container.is-stacked .divider {
    width: 100%;
    height: var(--divider-size);
    flex: 0 0 var(--divider-size);
    cursor: row-resize;
  }
  .split-container.is-stacked .divider::before {
    top: 50%; left: 0; right: 0; bottom: auto;
    width: auto; height: 1px;
    transform: translateY(-50%);
  }
  .split-container.is-stacked .divider:hover::before,
  .split-container.is-stacked .divider:focus-visible::before,
  .split-container.is-stacked .divider.is-dragging::before {
    height: 3px;
    width: auto;
  }

  .btn-label { display: none; }
  .btn { padding: 0 9px; }
  .btn svg { width: 18px; height: 18px; }

  .viewer-content { padding: 26px 18px; font-size: 15px; }
  .editor-textarea { padding: 16px 18px; }
}

@media (max-width: 480px) {
  .toolbar { gap: 2px; padding: 0 8px; }
  .toolbar-brand { padding-right: 6px; margin-right: 4px; }
  .filename-text { max-width: 84px; }
  .save-status span.save-status-label { display: none; }
}

</style>
</head>
<body>
  <div id="app">
    <!-- ============================= 상단 툴바 ============================= -->
    <header class="toolbar">
      <div class="toolbar-brand">
        <span class="toolbar-brand-mark" aria-hidden="true"></span>
        <span class="toolbar-brand-name">마크다운 에디터</span>
      </div>

      <div class="toolbar-actions">
        <button type="button" id="btn-new" class="btn" aria-label="새 문서 (Ctrl+N)" title="새 문서 (Ctrl+N)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h7l4 4V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"/><path d="M14 3.5V8h4"/><path d="M12 12.3v5M9.5 14.8h5"/></svg>
          <span class="btn-label">새 문서</span>
        </button>
        <button type="button" id="btn-open" class="btn" aria-label="파일 열기 (Ctrl+O)" title="파일 열기 (Ctrl+O)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.2c0-.66.54-1.2 1.2-1.2h4.3l1.6 2h8.7c.66 0 1.2.54 1.2 1.2v9.6c0 .66-.54 1.2-1.2 1.2H4.7c-.66 0-1.2-.54-1.2-1.2Z"/></svg>
          <span class="btn-label">열기</span>
        </button>
        <button type="button" id="btn-save" class="btn" aria-label="저장 (Ctrl+S)" title="저장 (Ctrl+S)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3.5h11.5L19.5 6.5V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"/><path d="M8 3.5V9h7V3.5"/><path d="M7.5 14h9v6h-9z"/></svg>
          <span class="btn-label">저장</span>
        </button>
        <button type="button" id="btn-save-as" class="btn" aria-label="다른 이름으로 저장" title="다른 이름으로 저장">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3.5h8.5L16 6v3.8"/><path d="M5 3.5a1 1 0 0 0-1 1V19a1 1 0 0 0 1 1h6.3"/><path d="M8 3.5V8h5.5"/><circle cx="17.3" cy="16.3" r="3.6"/><path d="M17.3 14.8v3M15.8 16.3h3"/></svg>
          <span class="btn-label">다른 이름으로 저장</span>
        </button>
      </div>

      <div class="toolbar-spacer"></div>

      <div class="toolbar-meta">
        <div class="filename-display">
          <span class="filename-text" id="filename-text">제목 없음.md</span>
        </div>
        <span class="save-status" id="save-status" data-state="saved">
          <span class="save-status-dot" aria-hidden="true"></span>
          <span class="save-status-label" id="save-status-label">저장됨</span>
        </span>
      </div>

      <button type="button" id="btn-theme-toggle" class="btn btn-ghost-icon" aria-label="다크 모드로 전환">
        <svg id="icon-theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.3 4.3l1.6 1.6M18.1 18.1l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.3 19.7l1.6-1.6M18.1 5.9l1.6-1.6"/></svg>
        <svg id="icon-theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="hidden"><path d="M20 14.2A8.2 8.2 0 1 1 9.8 4a6.4 6.4 0 0 0 10.2 10.2Z"/></svg>
      </button>
    </header>

    <!-- ============================= 본문: Viewer / Editor 분할 ============================= -->
    <main class="split-container" id="split-container">
      <section class="pane viewer-pane" id="viewer-pane" aria-label="Markdown 미리보기">
        <div class="pane-header">미리보기</div>
        <div class="pane-scroll scroll-area" id="viewer-scroll" tabindex="0">
          <div class="viewer-content" id="viewer-content"></div>
        </div>
      </section>

      <div class="divider"
           id="divider"
           role="separator"
           aria-orientation="vertical"
           aria-label="미리보기와 편집기 크기 조절 (방향키로 조절)"
           aria-valuemin="15"
           aria-valuemax="85"
           aria-valuenow="50"
           tabindex="0"></div>

      <section class="pane editor-pane" id="editor-pane" aria-label="Markdown 편집기">
        <div class="pane-header">편집기</div>
        <textarea
          class="editor-textarea scroll-area"
          id="editor"
          spellcheck="false"
          autocapitalize="off"
          autocorrect="off"
          aria-label="Markdown 원문 편집기"
          placeholder="여기에 Markdown 문서를 입력하세요…"></textarea>
      </section>
    </main>

    <!-- ============================= 하단 상태바 ============================= -->
    <footer class="statusbar">
      <span class="status-message" id="status-message" data-type="info" role="status" aria-live="polite"></span>
      <span class="doc-info" id="doc-info">0자 · 0 Bytes</span>
    </footer>
  </div>

  <!-- ============================= 모달 (확인창 / 입력창 공용) ============================= -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc" id="modal">
      <h2 id="modal-title">제목</h2>
      <p id="modal-desc">설명 텍스트</p>
      <div class="modal-input-wrap hidden" id="modal-input-wrap">
        <label for="modal-input" id="modal-input-label">파일명</label>
        <input type="text" class="modal-input" id="modal-input" autocomplete="off">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="modal-cancel">취소</button>
        <button type="button" class="btn btn-primary" id="modal-confirm">확인</button>
      </div>
    </div>
  </div>

  <!-- ============================= 토스트(간단 알림) ============================= -->
  <div class="toast-region" id="toast-region" aria-live="polite"></div>

  <!-- 숨김 파일 입력 (File System Access API 미지원 브라우저용 폴백) -->
  <input type="file" id="file-input" class="sr-only" accept=".md,.markdown,.txt,text/markdown,text/plain" aria-hidden="true" tabindex="-1">

     - marked.js  : Markdown → HTML 변환
     - DOMPurify  : 변환된 HTML 살균 처리 (XSS 방지)

<!-- ============================================================
     애플리케이션 코드
     ============================================================ -->
<script>
(function () {
  'use strict';

  /* ============================================================
     0. 상수
     ============================================================ */
  var DEFAULT_FILENAME = '제목 없음.md';
  var INDENT = '  '; // Tab 입력 시 삽입할 들여쓰기(공백 2칸)
  var RENDER_DEBOUNCE_MS = 120; // Editor 입력 → Viewer 재렌더링 디바운스
  var RESIZE_DEBOUNCE_MS = 100; // 창 크기 변경 디바운스
  var STATUS_MESSAGE_TIMEOUT_MS = 4200; // 하단 상태 메시지 자동 소멸 시간
  var TOAST_TIMEOUT_MS = 3000;
  var MIN_SPLIT_RATIO = 0.15;
  var MAX_SPLIT_RATIO = 0.85;
  var KEYBOARD_RESIZE_STEP = 0.02;
  var NARROW_BREAKPOINT_QUERY = '(max-width: 768px)';

  /* ============================================================
     1. 유틸리티 함수
     ============================================================ */
  function debounce(fn, wait) {
    var timerId = null;
    function debounced() {
      var args = arguments;
      clearTimeout(timerId);
      timerId = setTimeout(function () {
        fn.apply(null, args);
      }, wait);
    }
    debounced.cancel = function () { clearTimeout(timerId); };
    return debounced;
  }

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + ' Bytes';
    var units = ['KB', 'MB', 'GB'];
    var value = bytes / 1024;
    var unitIndex = 0;
    while (value >= 1024 && unitIndex < units.length - 1) {
      value /= 1024;
      unitIndex += 1;
    }
    var decimals = value >= 10 ? 0 : 1;
    return value.toFixed(decimals) + ' ' + units[unitIndex];
  }

  function getUtf8ByteLength(str) {
    return new TextEncoder().encode(str).length;
  }

  function countCharacters(str) {
    // 서로게이트 페어(이모지 등)를 한 글자로 정확히 세기 위해 Array.from 사용
    return Array.from(str).length;
  }

  function hasMdExtension(filename) {
    return /\.(md|markdown)$/i.test(filename || '');
  }

  function isMac() {
    var platform = (navigator.userAgentData && navigator.userAgentData.platform) ||
      navigator.platform || navigator.userAgent || '';
    return /Mac|iPhone|iPad|iPod/i.test(platform);
  }

  function shortcutHint(letter) {
    return isMac() ? '\u2318' + letter : 'Ctrl+' + letter;
  }

  function safeMatchMedia(query) {
    // 매우 오래되었거나 특수한 브라우저 환경에서 matchMedia 자체가 없을 수 있으므로
    // 항상 안전하게 동작하는 폴백 객체를 반환한다(테마/반응형 레이아웃 감지가 이 함수에 의존).
    if (window.matchMedia) {
      try {
        return window.matchMedia(query);
      } catch (err) {
        console.error('[safeMatchMedia] matchMedia 호출 오류:', err);
      }
    }
    return { matches: false, addEventListener: function () {}, addListener: function () {} };
  }

  /* ============================================================
     2. 애플리케이션 상태 (단일 객체로 관리)
     ============================================================ */
  var state = {
    content: '',                  // Editor의 현재 Markdown 원문
    fileName: DEFAULT_FILENAME,   // 화면에 표시되는 파일명
    fileHandle: null,             // FileSystemFileHandle | null
    isDirty: false,                // 마지막 저장 이후 변경 여부
    showWelcomeGuide: true,        // 최초 진입(어떤 문서도 열거나 만들지 않은) 안내 화면 표시 여부
    theme: 'light',                // 'light' | 'dark'
    splitRatio: 0.5,                // Viewer 영역이 차지하는 비율 (0.15~0.85)
    isNarrowLayout: false,          // 반응형: 상하 배치(좁은 화면) 여부
  };

  /* ============================================================
     3. DOM 참조 캐시
     ============================================================ */
  var dom = {};
  function cacheDom() {
    dom.btnNew = document.getElementById('btn-new');
    dom.btnOpen = document.getElementById('btn-open');
    dom.btnSave = document.getElementById('btn-save');
    dom.btnSaveAs = document.getElementById('btn-save-as');
    dom.btnThemeToggle = document.getElementById('btn-theme-toggle');
    dom.iconSun = document.getElementById('icon-theme-sun');
    dom.iconMoon = document.getElementById('icon-theme-moon');

    dom.filenameText = document.getElementById('filename-text');
    dom.saveStatus = document.getElementById('save-status');
    dom.saveStatusLabel = document.getElementById('save-status-label');

    dom.splitContainer = document.getElementById('split-container');
    dom.viewerPane = document.getElementById('viewer-pane');
    dom.viewerScroll = document.getElementById('viewer-scroll');
    dom.viewerContent = document.getElementById('viewer-content');
    dom.divider = document.getElementById('divider');
    dom.editorPane = document.getElementById('editor-pane');
    dom.editor = document.getElementById('editor');

    dom.statusMessage = document.getElementById('status-message');
    dom.docInfo = document.getElementById('doc-info');

    dom.modalOverlay = document.getElementById('modal-overlay');
    dom.modal = document.getElementById('modal');
    dom.modalTitle = document.getElementById('modal-title');
    dom.modalDesc = document.getElementById('modal-desc');
    dom.modalInputWrap = document.getElementById('modal-input-wrap');
    dom.modalInput = document.getElementById('modal-input');
    dom.modalInputLabel = document.getElementById('modal-input-label');
    dom.modalCancel = document.getElementById('modal-cancel');
    dom.modalConfirm = document.getElementById('modal-confirm');

    dom.toastRegion = document.getElementById('toast-region');
    dom.fileInput = document.getElementById('file-input');
  }

  /* ============================================================
     4. Markdown 렌더링 모듈
     - marked.js로 HTML 변환 → DOMPurify로 살균(XSS 방지) 후 반환
     ============================================================ */
  var MarkdownRenderer = {
    ready: false,

    init: function () {
      if (typeof marked === 'undefined') {
        console.error('[MarkdownRenderer] marked 라이브러리를 찾을 수 없습니다.');
        this.ready = false;
        return;
      }
      marked.setOptions({
        gfm: true,     // 표, 취소선 등 GitHub Flavored Markdown 지원
        breaks: false, // 표준 Markdown 규칙(빈 줄로 문단 구분)을 따름
      });
      this.ready = true;
    },

    render: function (markdownText) {
      if (!this.ready) {
        return '<p style="color:var(--danger)">Markdown 라이브러리를 불러오지 못해 미리보기를 표시할 수 없습니다. 페이지를 새로고침해 주세요.</p>';
      }

      var rawHtml;
      try {
        rawHtml = marked.parse(markdownText || '');
      } catch (err) {
        console.error('[MarkdownRenderer] Markdown 파싱 오류:', err);
        return '<p style="color:var(--danger)">이 문서의 일부 Markdown 문법을 해석하는 중 오류가 발생했습니다. 문법을 확인해 주세요.</p>';
      }

      if (typeof DOMPurify === 'undefined') {
        // 살균 라이브러리를 사용할 수 없는 경우, 원본 HTML을 그대로 삽입하지 않고
        // 텍스트로만 안전하게 표시하여 XSS 위험을 방지한다.
        console.error('[MarkdownRenderer] DOMPurify 라이브러리를 찾을 수 없어 안전 모드로 표시합니다.');
        var safeDiv = document.createElement('div');
        safeDiv.textContent = markdownText;
        return '<pre style="white-space:pre-wrap;font-family:inherit;">' + safeDiv.innerHTML + '</pre>';
      }

      try {
        return DOMPurify.sanitize(rawHtml);
      } catch (err) {
        console.error('[MarkdownRenderer] 살균(sanitize) 처리 중 오류:', err);
        return '<p style="color:var(--danger)">문서를 안전하게 표시하는 중 오류가 발생했습니다.</p>';
      }
    },
  };

  /* ============================================================
     5. UI 모듈
     - Viewer 렌더링, 상태 표시, 테마, 분할 크기 조절, 모달, 토스트
     ============================================================ */
  var UI = {
    statusMessageTimer: null,
    narrowMediaQuery: null,
    modalActiveResolve: null,
    modalLastFocusedElement: null,

    /* ---------- Viewer 렌더링 ---------- */
    renderViewer: function () {
      if (state.content.length === 0) {
        dom.viewerContent.innerHTML = '';
        if (state.showWelcomeGuide) {
          dom.viewerContent.appendChild(UI.buildWelcomeGuide());
        }
        return;
      }
      dom.viewerContent.innerHTML = MarkdownRenderer.render(state.content);
      UI.hardenExternalLinks();
    },

    buildWelcomeGuide: function () {
      var wrap = document.createElement('div');
      wrap.className = 'viewer-empty-guide';
      wrap.innerHTML =
        '<div class="viewer-empty-guide-inner">' +
        '<svg class="viewer-empty-guide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h8l4 4V19a1.2 1.2 0 0 1-1.2 1.2H6.5A1.2 1.2 0 0 1 5.3 19V4.7A1.2 1.2 0 0 1 6.5 3.5Z"/><path d="M14.5 3.5V7.5a.5.5 0 0 0 .5.5h4"/><path d="M8.3 12.2h7.4M8.3 15.2h7.4M8.3 9.2h4"/></svg>' +
        '<h2>Markdown 문서를 열어보세요</h2>' +
        '<p>왼쪽에는 서식이 적용된 미리보기가, 오른쪽에는 원본 텍스트 편집기가 표시됩니다. 편집 내용은 별도 저장 없이 실시간으로 반영됩니다.</p>' +
        '<div class="viewer-empty-guide-shortcuts">' +
        '<div><kbd>' + shortcutHint('O') + '</kbd><span>파일 열기</span></div>' +
        '<div><kbd>' + shortcutHint('S') + '</kbd><span>저장</span></div>' +
        '<div><kbd>' + shortcutHint('N') + '</kbd><span>새 문서</span></div>' +
        '</div></div>';
      return wrap;
    },

    hardenExternalLinks: function () {
      // 렌더링된 문서의 링크는 새 탭에서 열어 편집 중인 세션을 보존하고,
      // rel 속성으로 탭 하이재킹(reverse tabnabbing)을 방지한다.
      var anchors = dom.viewerContent.querySelectorAll('a[href]');
      for (var i = 0; i < anchors.length; i++) {
        anchors[i].setAttribute('target', '_blank');
        anchors[i].setAttribute('rel', 'noopener noreferrer');
      }
    },

    /* ---------- 상태 표시 ---------- */
    setStatusMessage: function (text, type) {
      dom.statusMessage.textContent = text || '';
      dom.statusMessage.dataset.type = type || 'info';
      clearTimeout(UI.statusMessageTimer);
      if (text) {
        UI.statusMessageTimer = setTimeout(function () {
          dom.statusMessage.textContent = '';
        }, STATUS_MESSAGE_TIMEOUT_MS);
      }
    },

    showToast: function (text, type) {
      var toast = document.createElement('div');
      toast.className = 'toast';
      toast.dataset.type = type || 'default';
      toast.setAttribute('role', type === 'error' ? 'alert' : 'status');
      toast.textContent = text;
      dom.toastRegion.appendChild(toast);
      requestAnimationFrame(function () {
        toast.classList.add('is-visible');
      });
      setTimeout(function () {
        toast.classList.remove('is-visible');
        setTimeout(function () { toast.remove(); }, 220);
      }, TOAST_TIMEOUT_MS);
    },

    updateFilenameDisplay: function () {
      dom.filenameText.textContent = state.fileName;
      dom.filenameText.title = state.fileName;
      document.title = (state.isDirty ? '\u2022 ' : '') + state.fileName + ' — 마크다운 에디터';
    },

    updateSaveStatus: function () {
      var s = state.isDirty ? 'dirty' : 'saved';
      dom.saveStatus.dataset.state = s;
      dom.saveStatusLabel.textContent = state.isDirty ? '수정됨' : '저장됨';
    },

    updateDocInfo: function () {
      var charCount = countCharacters(state.content);
      var byteSize = getUtf8ByteLength(state.content);
      dom.docInfo.textContent = charCount.toLocaleString('ko-KR') + '자 · ' + formatBytes(byteSize);
    },

    markDirty: function (isDirty) {
      state.isDirty = isDirty;
      UI.updateSaveStatus();
      UI.updateFilenameDisplay();
    },

    /* ---------- 테마(다크/라이트 모드) ---------- */
    initTheme: function () {
      var prefersDark = safeMatchMedia('(prefers-color-scheme: dark)').matches;
      UI.setTheme(prefersDark ? 'dark' : 'light');
    },

    setTheme: function (theme) {
      state.theme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      dom.btnThemeToggle.setAttribute('aria-label', theme === 'dark' ? '라이트 모드로 전환' : '다크 모드로 전환');
      dom.iconSun.classList.toggle('hidden', theme === 'dark');
      dom.iconMoon.classList.toggle('hidden', theme !== 'dark');
    },

    toggleTheme: function () {
      UI.setTheme(state.theme === 'dark' ? 'light' : 'dark');
    },

    /* ---------- 반응형 레이아웃 ---------- */
    initResponsive: function () {
      UI.narrowMediaQuery = safeMatchMedia(NARROW_BREAKPOINT_QUERY);
      UI.applyLayoutMode(UI.narrowMediaQuery.matches);
      var handler = function (e) { UI.applyLayoutMode(e.matches); };
      if (UI.narrowMediaQuery.addEventListener) {
        UI.narrowMediaQuery.addEventListener('change', handler);
      } else if (UI.narrowMediaQuery.addListener) {
        UI.narrowMediaQuery.addListener(handler); // 구형 Safari 호환
      }
    },

    applyLayoutMode: function (isNarrow) {
      state.isNarrowLayout = isNarrow;
      dom.splitContainer.classList.toggle('is-stacked', isNarrow);
      dom.divider.setAttribute('aria-orientation', isNarrow ? 'horizontal' : 'vertical');
      dom.divider.setAttribute('aria-label', isNarrow
        ? '미리보기와 편집기 크기 조절 (위/아래 방향키)'
        : '미리보기와 편집기 크기 조절 (좌/우 방향키)');
      UI.applySplitRatio();
    },

    /* ---------- 분할 영역 크기 조절 ---------- */
    applySplitRatio: function () {
      var viewerPercent = Math.round(state.splitRatio * 1000) / 10;
      var editorPercent = Math.round((1 - state.splitRatio) * 1000) / 10;
      dom.viewerPane.style.flex = '0 0 ' + viewerPercent + '%';
      dom.editorPane.style.flex = '0 0 ' + editorPercent + '%';
      dom.divider.setAttribute('aria-valuenow', String(Math.round(viewerPercent)));
    },

    setSplitRatio: function (ratio) {
      state.splitRatio = Math.min(MAX_SPLIT_RATIO, Math.max(MIN_SPLIT_RATIO, ratio));
      UI.applySplitRatio();
    },

    initDividerDrag: function () {
      var dragging = false;

      function ratioFromPointer(clientX, clientY) {
        var rect = dom.splitContainer.getBoundingClientRect();
        if (state.isNarrowLayout) {
          return (clientY - rect.top) / rect.height;
        }
        return (clientX - rect.left) / rect.width;
      }

      function onPointerDown(e) {
        dragging = true;
        dom.divider.classList.add('is-dragging');
        if (dom.divider.setPointerCapture) {
          try { dom.divider.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
        }
        document.body.style.userSelect = 'none';
        document.body.style.cursor = state.isNarrowLayout ? 'row-resize' : 'col-resize';
      }

      function onPointerMove(e) {
        if (!dragging) return;
        UI.setSplitRatio(ratioFromPointer(e.clientX, e.clientY));
      }

      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        dom.divider.classList.remove('is-dragging');
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
        if (e && dom.divider.releasePointerCapture && e.pointerId !== undefined) {
          try { dom.divider.releasePointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
        }
      }

      dom.divider.addEventListener('pointerdown', onPointerDown);
      dom.divider.addEventListener('pointermove', onPointerMove);
      dom.divider.addEventListener('pointerup', endDrag);
      dom.divider.addEventListener('pointercancel', endDrag);
      dom.divider.addEventListener('dblclick', function () { UI.setSplitRatio(0.5); });

      dom.divider.addEventListener('keydown', function (e) {
        var horizontalKeys = ['ArrowLeft', 'ArrowRight'];
        var verticalKeys = ['ArrowUp', 'ArrowDown'];
        var relevantKeys = state.isNarrowLayout ? verticalKeys : horizontalKeys;
        var isStep = relevantKeys.indexOf(e.key) !== -1;
        var isEdge = e.key === 'Home' || e.key === 'End';
        if (!isStep && !isEdge) return;
        e.preventDefault();
        if (e.key === 'Home') { UI.setSplitRatio(MIN_SPLIT_RATIO); return; }
        if (e.key === 'End') { UI.setSplitRatio(MAX_SPLIT_RATIO); return; }
        var increasing = e.key === 'ArrowRight' || e.key === 'ArrowDown';
        UI.setSplitRatio(state.splitRatio + (increasing ? KEYBOARD_RESIZE_STEP : -KEYBOARD_RESIZE_STEP));
      });
    },

    /* ---------- 모달(확인창 / 파일명 입력창 공용) ---------- */
    openModal: function (options) {
      return new Promise(function (resolve) {
        UI.modalActiveResolve = resolve;
        UI.modalLastFocusedElement = document.activeElement;

        dom.modalTitle.textContent = options.title;
        dom.modalDesc.textContent = options.desc;
        dom.modalConfirm.textContent = options.confirmLabel || '확인';
        dom.modalCancel.textContent = options.cancelLabel || '취소';

        if (options.showInput) {
          dom.modalInputWrap.classList.remove('hidden');
          dom.modalInputLabel.textContent = options.inputLabel || '';
          dom.modalInput.value = options.inputValue || '';
        } else {
          dom.modalInputWrap.classList.add('hidden');
        }

        dom.modalOverlay.classList.remove('hidden');
        requestAnimationFrame(function () { dom.modalOverlay.classList.add('is-open'); });

        setTimeout(function () {
          var focusTarget = options.showInput ? dom.modalInput : dom.modalConfirm;
          focusTarget.focus();
          if (options.showInput) dom.modalInput.select();
        }, 50);
      });
    },

    closeModal: function (result) {
      dom.modalOverlay.classList.remove('is-open');
      setTimeout(function () { dom.modalOverlay.classList.add('hidden'); }, 180);
      if (UI.modalLastFocusedElement && UI.modalLastFocusedElement.focus) {
        UI.modalLastFocusedElement.focus();
      }
      if (UI.modalActiveResolve) {
        var resolve = UI.modalActiveResolve;
        UI.modalActiveResolve = null;
        resolve(result);
      }
    },

    confirmDialog: function (title, desc, confirmLabel) {
      return UI.openModal({
        title: title, desc: desc, confirmLabel: confirmLabel || '계속 진행', cancelLabel: '취소', showInput: false,
      }).then(function (result) { return result === true; });
    },

    promptForFilename: function (currentName) {
      var baseName = (currentName || '').replace(/\.(md|markdown)$/i, '') || '제목 없음';
      return UI.openModal({
        title: '다른 이름으로 저장',
        desc: '저장할 파일 이름을 입력해 주세요. 확장자(.md)는 자동으로 붙습니다.',
        confirmLabel: '저장',
        cancelLabel: '취소',
        showInput: true,
        inputLabel: '파일 이름',
        inputValue: baseName,
      }).then(function (result) {
        if (result !== true) return null;
        var typed = dom.modalInput.value.trim();
        return typed || baseName;
      });
    },

    initModalHandlers: function () {
      dom.modalConfirm.addEventListener('click', function () { UI.closeModal(true); });
      dom.modalCancel.addEventListener('click', function () { UI.closeModal(false); });
      dom.modalOverlay.addEventListener('click', function (e) {
        if (e.target === dom.modalOverlay) UI.closeModal(false);
      });
      dom.modalInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); UI.closeModal(true); }
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && dom.modalOverlay.classList.contains('is-open')) {
          UI.closeModal(false);
        }
      });
      // 모달 내부 Tab 포커스 순환(포커스 트랩)
      dom.modal.addEventListener('keydown', function (e) {
        if (e.key !== 'Tab') return;
        var focusables = Array.prototype.slice
          .call(dom.modal.querySelectorAll('button, input, [tabindex]:not([tabindex="-1"])'))
          .filter(function (el) { return !el.disabled && el.offsetParent !== null; });
        if (focusables.length === 0) return;
        var first = focusables[0];
        var last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault(); last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault(); first.focus();
        }
      });
    },
  };

  /* ============================================================
     6. 파일 처리 모듈
     - File System Access API 우선 사용, 미지원 브라우저는 다운로드 방식으로 대체
     ============================================================ */
  var FileManager = {
    supportsFSA: ('showOpenFilePicker' in window) && ('showSaveFilePicker' in window),

    pickerTypes: [
      { description: 'Markdown 파일', accept: { 'text/markdown': ['.md', '.markdown'] } },
    ],

    /* 파일 열기: FSA API 지원 시 결과를 즉시 반환(Promise),
       미지원 시 폴백 input을 클릭만 하고 undefined를 반환 →
       실제 처리는 change 이벤트 핸들러(handleFileInputChange)가 이어받는다. */
    openFile: function () {
      if (this.supportsFSA) {
        return window.showOpenFilePicker({ types: this.pickerTypes }).then(function (handles) {
          var handle = handles[0];
          return handle.getFile().then(function (file) {
            return file.text().then(function (text) {
              return { text: text, name: file.name, handle: handle };
            });
          });
        }).catch(function (err) {
          if (err && err.name === 'AbortError') return null; // 사용자가 선택 취소
          console.error('[FileManager] 파일 열기 오류:', err);
          UI.setStatusMessage('파일을 여는 중 문제가 발생했습니다.', 'error');
          return null;
        });
      }
      dom.fileInput.value = '';
      dom.fileInput.click();
      return Promise.resolve(undefined);
    },

    readFileFromInput: function (file) {
      return file.text().then(function (text) {
        return { text: text, name: file.name, handle: null };
      }).catch(function (err) {
        console.error('[FileManager] 파일 읽기 오류:', err);
        UI.setStatusMessage('파일을 읽을 수 없습니다. 기존 문서 내용은 유지됩니다.', 'error');
        return null;
      });
    },

    ensureWritePermission: function (handle) {
      if (!handle.queryPermission) return Promise.resolve(true); // 구형 구현 보수적 허용
      return handle.queryPermission({ mode: 'readwrite' }).then(function (permission) {
        if (permission === 'granted') return true;
        return handle.requestPermission({ mode: 'readwrite' }).then(function (p) {
          return p === 'granted';
        });
      });
    },

    writeToHandle: function (handle, text) {
      return this.ensureWritePermission(handle).then(function (granted) {
        if (!granted) {
          var permErr = new Error('PERMISSION_DENIED');
          throw permErr;
        }
        return handle.createWritable().then(function (writable) {
          return writable.write(text).then(function () {
            return writable.close();
          }, function (writeErr) {
            // 쓰기 실패 시에도 스트림을 정리한다.
            return writable.close().finally(function () { throw writeErr; });
          });
        });
      });
    },

    downloadAsFile: function (text, filename) {
      var blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    },

    save: function () {
      var self = this;
      if (state.fileHandle && this.supportsFSA) {
        return this.writeToHandle(state.fileHandle, state.content).then(function () {
          return { ok: true, mode: 'handle' };
        }).catch(function (err) {
          console.error('[FileManager] 저장 오류:', err);
          if (err && err.message === 'PERMISSION_DENIED') {
            UI.setStatusMessage('파일 저장 권한이 거부되었습니다. "다른 이름으로 저장"을 이용해 주세요.', 'error');
          } else {
            UI.setStatusMessage('파일을 저장하지 못했습니다. 편집 중인 내용은 유지됩니다.', 'error');
          }
          return { ok: false };
        });
      }
      try {
        self.downloadAsFile(state.content, state.fileName);
        return Promise.resolve({ ok: true, mode: 'download' });
      } catch (err) {
        console.error('[FileManager] 다운로드 오류:', err);
        UI.setStatusMessage('파일 다운로드에 실패했습니다. 편집 중인 내용은 유지됩니다.', 'error');
        return Promise.resolve({ ok: false });
      }
    },

    saveAs: function () {
      var self = this;
      if (this.supportsFSA) {
        return window.showSaveFilePicker({ suggestedName: state.fileName, types: this.pickerTypes })
          .then(function (handle) {
            return self.writeToHandle(handle, state.content).then(function () {
              return { ok: true, mode: 'handle', handle: handle, name: handle.name };
            });
          }).catch(function (err) {
            if (err && err.name === 'AbortError') return { ok: false, cancelled: true };
            console.error('[FileManager] 다른 이름으로 저장 오류:', err);
            UI.setStatusMessage('파일을 저장하지 못했습니다. 편집 중인 내용은 유지됩니다.', 'error');
            return { ok: false };
          });
      }
      return UI.promptForFilename(state.fileName).then(function (chosenName) {
        if (chosenName === null) return { ok: false, cancelled: true };
        var finalName = hasMdExtension(chosenName) ? chosenName : chosenName + '.md';
        try {
          self.downloadAsFile(state.content, finalName);
          return { ok: true, mode: 'download', name: finalName };
        } catch (err) {
          console.error('[FileManager] 다운로드 오류:', err);
          UI.setStatusMessage('파일 다운로드에 실패했습니다. 편집 중인 내용은 유지됩니다.', 'error');
          return { ok: false };
        }
      });
    },
  };

  /* ============================================================
     7. 문서 동작 (열기 / 저장 / 다른 이름으로 저장 / 새 문서)
     ============================================================ */
  var DocumentActions = {
    loadIntoEditor: function (text, name, handle) {
      state.content = text;
      state.fileName = name;
      state.fileHandle = handle;
      state.showWelcomeGuide = false;

      dom.editor.value = text;
      dom.editor.scrollTop = 0;
      dom.editor.setSelectionRange(0, 0);

      UI.markDirty(false);
      UI.updateFilenameDisplay();
      UI.updateDocInfo();
      UI.renderViewer();
      dom.viewerScroll.scrollTop = 0;
      dom.editor.focus();
    },

    confirmDiscardIfDirty: function (actionLabel) {
      if (!state.isDirty) return Promise.resolve(true);
      return UI.confirmDialog(
        '저장하지 않은 변경사항이 있습니다',
        actionLabel + ' 현재 변경사항이 사라집니다. 계속하시겠습니까?',
        '계속 진행'
      );
    },

    handleOpen: function () {
      return FileManager.openFile().then(function (result) {
        if (result === undefined) return; // 폴백 경로: change 이벤트에서 이어서 처리
        if (result === null) return; // 취소 또는 오류
        return DocumentActions.finishOpen(result);
      });
    },

    finishOpen: function (result) {
      return DocumentActions.confirmDiscardIfDirty('선택한 파일을 열면').then(function (proceed) {
        if (!proceed) return;
        if (!hasMdExtension(result.name)) {
          UI.setStatusMessage('"' + result.name + '"은(는) Markdown(.md) 파일이 아닙니다. 텍스트로 열었습니다.', 'info');
        } else {
          UI.setStatusMessage('"' + result.name + '" 파일을 열었습니다.', 'success');
        }
        DocumentActions.loadIntoEditor(result.text, result.name, result.handle);
      });
    },

    handleFileInputChange: function (fileList) {
      var file = fileList && fileList[0];
      if (!file) return Promise.resolve();
      return FileManager.readFileFromInput(file).then(function (result) {
        if (!result) return;
        return DocumentActions.finishOpen(result);
      });
    },

    handleSave: function () {
      return FileManager.save().then(function (outcome) {
        if (!outcome.ok) return;
        UI.markDirty(false);
        UI.setStatusMessage(
          outcome.mode === 'handle' ? '파일에 저장했습니다.' : ('"' + state.fileName + '" 파일을 다운로드했습니다.'),
          'success'
        );
      });
    },

    handleSaveAs: function () {
      return FileManager.saveAs().then(function (outcome) {
        if (!outcome.ok) return;
        if (outcome.name) state.fileName = outcome.name;
        if (outcome.handle) state.fileHandle = outcome.handle;
        UI.markDirty(false);
        UI.updateFilenameDisplay();
        UI.setStatusMessage(
          outcome.mode === 'handle' ? ('"' + state.fileName + '"(으)로 저장했습니다.') : ('"' + state.fileName + '" 파일을 다운로드했습니다.'),
          'success'
        );
      });
    },

    handleNewDocument: function () {
      return DocumentActions.confirmDiscardIfDirty('새 문서를 만들면').then(function (proceed) {
        if (!proceed) return;
        state.content = '';
        state.fileName = DEFAULT_FILENAME;
        state.fileHandle = null;
        state.showWelcomeGuide = false; // 사용자가 명시적으로 새 문서를 선택했으므로 안내 문구 대신 빈 화면 표시

        dom.editor.value = '';
        UI.markDirty(false);
        UI.updateFilenameDisplay();
        UI.updateDocInfo();
        UI.renderViewer();
        dom.editor.focus();
        UI.setStatusMessage('새 문서를 만들었습니다.', 'info');
      });
    },
  };

  /* ============================================================
     8. Editor 입력 처리 (실시간 미리보기 + Tab 들여쓰기)
     ============================================================ */
  var debouncedRenderViewer = debounce(function () { UI.renderViewer(); }, RENDER_DEBOUNCE_MS);

  function handleEditorInput() {
    state.content = dom.editor.value;
    if (state.showWelcomeGuide) state.showWelcomeGuide = false;
    if (!state.isDirty) UI.markDirty(true);
    UI.updateDocInfo();
    debouncedRenderViewer();
  }

  function handleEditorKeydown(e) {
    if (e.key !== 'Tab') return;
    e.preventDefault();

    var ta = dom.editor;
    var selectionStart = ta.selectionStart;
    var selectionEnd = ta.selectionEnd;
    var value = ta.value;

    // 커서만 있고(선택 영역 없음) Tab인 경우: 커서 위치에 들여쓰기 삽입
    if (!e.shiftKey && selectionStart === selectionEnd) {
      ta.value = value.slice(0, selectionStart) + INDENT + value.slice(selectionEnd);
      ta.selectionStart = ta.selectionEnd = selectionStart + INDENT.length;
      handleEditorInput();
      return;
    }

    // 여러 줄 선택 또는 Shift+Tab: 줄 단위 들여쓰기/내어쓰기
    var effectiveEnd = selectionEnd;
    if (selectionEnd > selectionStart && value.charAt(effectiveEnd - 1) === '\n') {
      effectiveEnd -= 1; // 선택이 줄바꿈 직후에서 끝나면 다음 빈 줄까지 포함되지 않도록 보정
    }
    var lineStart = value.lastIndexOf('\n', selectionStart - 1) + 1;
    var nextNewline = value.indexOf('\n', effectiveEnd);
    var lineEnd = nextNewline === -1 ? value.length : nextNewline;

    var before = value.slice(0, lineStart);
    var block = value.slice(lineStart, lineEnd);
    var after = value.slice(lineEnd);
    var lines = block.split('\n');

    var startDelta = 0;
    var totalDelta = 0;

    var newLines = lines.map(function (line, idx) {
      if (e.shiftKey) {
        var trimCount = 0;
        if (line.indexOf(INDENT) === 0) {
          trimCount = INDENT.length;
        } else if (line.charAt(0) === '\t') {
          trimCount = 1;
        } else {
          var leadingSpaces = (line.match(/^ */) || [''])[0].length;
          trimCount = Math.min(leadingSpaces, INDENT.length);
        }
        if (idx === 0) startDelta = -trimCount;
        totalDelta -= trimCount;
        return line.slice(trimCount);
      }
      if (idx === 0) startDelta = INDENT.length;
      totalDelta += INDENT.length;
      return INDENT + line;
    });

    ta.value = before + newLines.join('\n') + after;
    ta.selectionStart = Math.max(lineStart, selectionStart + startDelta);
    ta.selectionEnd = Math.max(ta.selectionStart, selectionEnd + totalDelta);
    handleEditorInput();
  }

  /* ============================================================
     9. 전역 키보드 단축키 (Ctrl/Cmd + S, O, N)
     ============================================================ */
  function handleGlobalKeydown(e) {
    var mod = e.ctrlKey || e.metaKey;
    if (!mod) return;
    var key = e.key.toLowerCase();
    // 참고: Ctrl/Cmd+N은 일부 브라우저에서 "새 창 열기"로 예약되어 있어
    // preventDefault가 무시될 수 있다(브라우저 자체 제약, JS로 해결 불가).
    if (key === 's') {
      e.preventDefault();
      DocumentActions.handleSave();
    } else if (key === 'o') {
      e.preventDefault();
      DocumentActions.handleOpen();
    } else if (key === 'n') {
      e.preventDefault();
      DocumentActions.handleNewDocument();
    }
  }

  /* ============================================================
     10. 이벤트 바인딩 및 초기화
     ============================================================ */
  function bindEvents() {
    dom.btnNew.addEventListener('click', DocumentActions.handleNewDocument);
    dom.btnOpen.addEventListener('click', DocumentActions.handleOpen);
    dom.btnSave.addEventListener('click', DocumentActions.handleSave);
    dom.btnSaveAs.addEventListener('click', DocumentActions.handleSaveAs);
    dom.btnThemeToggle.addEventListener('click', UI.toggleTheme);

    dom.editor.addEventListener('input', handleEditorInput);
    dom.editor.addEventListener('keydown', handleEditorKeydown);

    dom.fileInput.addEventListener('change', function (e) {
      DocumentActions.handleFileInputChange(e.target.files);
    });

    document.addEventListener('keydown', handleGlobalKeydown);

    window.addEventListener('resize', debounce(function () { UI.applySplitRatio(); }, RESIZE_DEBOUNCE_MS));

    window.addEventListener('beforeunload', function (e) {
      if (!state.isDirty) return undefined;
      e.preventDefault();
      e.returnValue = '';
      return '';
    });
  }

  function showFatalInitError(err) {
    // 초기화 자체가 실패하면 화면이 아무 반응 없이 멈춘 것처럼 보일 수 있으므로,
    // 최소한의 안내 문구를 화면 전체에 표시해 사용자가 새로고침을 시도할 수 있도록 한다.
    console.error('[마크다운 에디터] 초기화 중 예상하지 못한 오류가 발생했습니다:', err);
    var banner = document.createElement('div');
    banner.setAttribute('role', 'alert');
    banner.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;' +
      'background:#1c1c1f;color:#fff;font-family:-apple-system,"Segoe UI","맑은 고딕",sans-serif;' +
      'text-align:center;padding:24px;z-index:9999;';
    banner.innerHTML = '<div style="max-width:420px;font-size:14.5px;line-height:1.7;">' +
      '앱을 초기화하는 중 문제가 발생했습니다.<br>페이지를 새로고침해 주세요.</div>';
    document.body.appendChild(banner);
  }

  function init() {
    try {
      cacheDom();
      MarkdownRenderer.init();
      UI.initTheme();
      UI.initResponsive();
      UI.initDividerDrag();
      UI.initModalHandlers();
      bindEvents();

      UI.updateFilenameDisplay();
      UI.updateSaveStatus();
      UI.updateDocInfo();
      UI.renderViewer();

      if (!FileManager.supportsFSA) {
        console.info('[마크다운 에디터] 이 브라우저는 File System Access API를 지원하지 않습니다. "저장"은 다운로드 방식으로 대체됩니다.');
      }
    } catch (err) {
      showFatalInitError(err);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
