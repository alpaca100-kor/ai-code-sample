<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" id="colorScheme" content="light dark">
<title>달력</title>
<script>
  (function () {
    var saved = localStorage.getItem('calendar-theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    var meta = document.getElementById('colorScheme');
    if (meta) meta.setAttribute('content', theme);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF1F5;
    --card: #FFFFFF;
    --ink: #1C2B39;
    --ink-soft: #96A3AE;
    --sun-red: #B3402C;
    --sat-blue: #2B5C8A;
    --stamp: #C7791A;
    --grid-line: #DEE3E8;
    --control-hover: #E3E8EC;
    --cta-hover: #142330;
    --today-bg: #111315;
    --today-fg: #FFFFFF;
    --rings-bg: #12181F;
    --rings-hole: #EEF1F5;
    --shadow: 0 24px 60px rgba(28, 43, 57, 0.14), 0 2px 8px rgba(28, 43, 57, 0.08);
    --sheet-border: none;
  }

  [data-theme="dark"] {
    --paper: #0F1720;
    --card: #1B2530;
    --ink: #E8ECF1;
    --ink-soft: #7C8894;
    --sun-red: #E2694F;
    --sat-blue: #5FA0DA;
    --stamp: #D68A3A;
    --grid-line: #2B3744;
    --control-hover: #29343F;
    --cta-hover: #D8E0E7;
    --today-bg: #FFFFFF;
    --today-fg: #111315;
    --rings-hole: #3A4753;
    --shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.4);
    --sheet-border: 1px solid rgba(255, 255, 255, 0.07);
  }

  * { box-sizing: border-box; }

  body,
  .sheet,
  .rings span,
  .controls input,
  .controls select,
  .controls button,
  .view-tabs button,
  .day,
  .day .num,
  .weekdays span,
  .weekdays-year span,
  .grid-year .month-label,
  .year-scroll {
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 14px;
    background: var(--paper);
    font-family: 'IBM Plex Sans KR', sans-serif;
    color: var(--ink);
  }

  .sheet {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: var(--shadow);
    border: var(--sheet-border);
  }

  .rings {
    background: var(--rings-bg);
    display: flex;
    justify-content: space-evenly;
    padding: 11px 22px 15px;
  }
  .rings span {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--rings-hole);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 14px 22px 0;
  }
  .view-tabs {
    display: inline-flex;
    background: var(--paper);
    border: 1px solid var(--grid-line);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }
  .view-tabs button {
    font-family: 'IBM Plex Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 12px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .view-tabs button.active {
    background: var(--ink);
    color: var(--paper);
  }
  .view-tabs button:focus-visible {
    outline: 2px solid var(--stamp);
    outline-offset: 2px;
  }

  .head {
    padding: 12px 22px 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .date-display {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .date-display .year {
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(20px, 6vw, 26px);
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }
  .date-display .month-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(42px, 12vw, 58px);
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .date-display .month-label {
    font-size: clamp(15px, 4vw, 19px);
    font-weight: 500;
    color: var(--ink-soft);
    align-self: flex-end;
    margin-bottom: 0.3em;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .controls input,
  .controls select,
  .controls button,
  #themeBtn {
    font-family: 'IBM Plex Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--grid-line);
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
  }
  .controls input[type="number"] {
    width: 78px;
    cursor: text;
  }
  .controls button {
    min-width: 40px;
  }
  .controls input:hover,
  .controls select:hover,
  .controls button:hover,
  #themeBtn:hover {
    background: var(--control-hover);
  }
  .controls input:focus-visible,
  .controls select:focus-visible,
  .controls button:focus-visible,
  #themeBtn:focus-visible {
    outline: 2px solid var(--stamp);
    outline-offset: 2px;
  }
  #todayBtn,
  #thisYearBtn {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
    font-weight: 600;
  }
  #todayBtn:hover,
  #thisYearBtn:hover {
    background: var(--cta-hover);
  }
  #themeBtn {
    font-size: 16px;
    line-height: 1;
    padding: 8px 11px;
  }

  .weekdays,
  .weekdays-year {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    text-align: center;
  }
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 4px 16px;
  }
  .weekdays-year {
    display: grid;
    grid-template-columns: 26px repeat(7, 1fr);
    padding: 6px 1px;
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--card);
  }
  .weekdays span, .weekdays-year span { padding: 6px 0; }
  .weekdays .sun, .weekdays-year .sun { color: var(--sun-red); }
  .weekdays .sat, .weekdays-year .sat { color: var(--sat-blue); }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    margin: 0 16px 22px;
    padding: 1px;
    background: var(--grid-line);
    border: 1px solid var(--grid-line);
    border-radius: 10px;
    overflow: hidden;
  }

  .year-scroll {
    margin: 0 16px 22px;
    border: 1px solid var(--grid-line);
    border-radius: 10px;
    overflow: hidden auto;
    max-height: 60vh;
  }
  .grid-year {
    display: grid;
    grid-template-columns: 26px repeat(7, 1fr);
    gap: 1px;
    padding: 1px;
    background: var(--grid-line);
  }

  .day {
    background: var(--card);
    aspect-ratio: 1 / 0.92;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(13px, 3.6vw, 16px);
    color: var(--ink);
    animation: fadeIn 0.2s ease;
  }
  .day.sun { color: var(--sun-red); }
  .day.sat { color: var(--sat-blue); }
  .day.other { color: var(--ink-soft); opacity: 0.6; }
  .day.other.sun, .day.other.sat { color: var(--ink-soft); }

  .day .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.9em;
    height: 1.9em;
    border-radius: 50%;
  }
  .day.today .num {
    background: var(--today-bg);
    color: var(--today-fg);
  }

  .grid-year .month-label {
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--stamp);
  }
  .grid-year .day {
    aspect-ratio: auto;
    height: 24px;
    font-size: 11px;
    animation: none;
  }
  .grid-year .day .num {
    width: 1.7em;
    height: 1.7em;
  }
  .grid-year .row-month-start {
    border-top: 2px solid var(--ink-soft);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(2px); }
    to { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .day { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="rings" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="top-bar">
      <div class="view-tabs" role="tablist">
        <button id="monthTab" class="active" role="tab" aria-selected="true" data-view="month">월별보기</button>
        <button id="yearTab" role="tab" aria-selected="false" data-view="year">1년전체</button>
      </div>
      <button id="themeBtn" title="다크모드 전환"></button>
    </div>

    <div class="panel" id="monthPanel">
      <div class="head">
        <div class="date-display" aria-live="polite">
          <span class="year" id="yearDisplay"></span>
          <span class="month-num" id="monthNum"></span><span class="month-label">월</span>
        </div>

        <div class="controls">
          <input type="number" id="yearInput" min="1" max="9999" aria-label="연도">
          <select id="monthSelect" aria-label="월"></select>
          <button id="prevBtn" aria-label="이전 달로 이동" title="이전 달">◀</button>
          <button id="nextBtn" aria-label="다음 달로 이동" title="다음 달">▶</button>
          <button id="todayBtn" title="오늘 날짜가 있는 달로 이동">오늘</button>
        </div>
      </div>

      <div class="weekdays">
        <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
      </div>

      <div class="grid" id="grid"></div>
    </div>

    <div class="panel" id="yearPanel" hidden>
      <div class="head">
        <div class="date-display" aria-live="polite">
          <span class="month-num" id="yearViewDisplay"></span>
        </div>

        <div class="controls">
          <input type="number" id="yearInputY" min="1" max="9999" aria-label="연도">
          <button id="prevYearBtn" aria-label="이전 해로 이동" title="이전 해">◀</button>
          <button id="nextYearBtn" aria-label="다음 해로 이동" title="다음 해">▶</button>
          <button id="thisYearBtn" title="올해로 이동">올해</button>
        </div>
      </div>

      <div class="year-scroll" id="yearScroll">
        <div class="weekdays-year">
          <span></span><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
        </div>

        <div class="grid-year" id="yearGrid"></div>
      </div>
    </div>
  </div>

<script>
  const state = { year: 0, month: 0 };

  const monthTab = document.getElementById('monthTab');
  const yearTab = document.getElementById('yearTab');
  const monthPanel = document.getElementById('monthPanel');
  const yearPanel = document.getElementById('yearPanel');

  const yearInput = document.getElementById('yearInput');
  const monthSelect = document.getElementById('monthSelect');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const todayBtn = document.getElementById('todayBtn');
  const themeBtn = document.getElementById('themeBtn');
  const colorScheme = document.getElementById('colorScheme');
  const yearDisplay = document.getElementById('yearDisplay');
  const monthNum = document.getElementById('monthNum');
  const grid = document.getElementById('grid');

  const yearViewDisplay = document.getElementById('yearViewDisplay');
  const yearInputY = document.getElementById('yearInputY');
  const prevYearBtn = document.getElementById('prevYearBtn');
  const nextYearBtn = document.getElementById('nextYearBtn');
  const thisYearBtn = document.getElementById('thisYearBtn');
  const yearGrid = document.getElementById('yearGrid');
  const yearScroll = document.getElementById('yearScroll');

  function applyThemeUI(theme) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    themeBtn.setAttribute('aria-label', theme === 'dark' ? '라이트모드로 전환' : '다크모드로 전환');
    colorScheme.setAttribute('content', theme === 'dark' ? 'dark' : 'light');
  }
  applyThemeUI(document.documentElement.getAttribute('data-theme'));

  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('calendar-theme', next);
    applyThemeUI(next);
  });

  function setView(view) {
    const isMonth = view === 'month';
    monthPanel.hidden = !isMonth;
    yearPanel.hidden = isMonth;
    monthTab.classList.toggle('active', isMonth);
    monthTab.setAttribute('aria-selected', String(isMonth));
    yearTab.classList.toggle('active', !isMonth);
    yearTab.setAttribute('aria-selected', String(!isMonth));
  }
  monthTab.addEventListener('click', () => setView('month'));
  yearTab.addEventListener('click', () => setView('year'));

  for (let m = 1; m <= 12; m++) {
    const opt = document.createElement('option');
    opt.value = String(m);
    opt.textContent = `${m}월`;
    monthSelect.appendChild(opt);
  }

  function daysInMonth(year, month) {
    return new Date(year, month, 0).getDate();
  }
  function firstWeekday(year, month) {
    return new Date(year, month - 1, 1).getDay();
  }

  function renderMonth() {
    const { year, month } = state;
    yearInput.value = year;
    monthSelect.value = String(month);
    yearDisplay.textContent = year;
    monthNum.textContent = month;

    const firstDay = firstWeekday(year, month);
    const totalDays = daysInMonth(year, month);

    const prevMonth = month === 1 ? 12 : month - 1;
    const prevYear = month === 1 ? year - 1 : year;
    const prevDays = daysInMonth(prevYear, prevMonth);

    const cells = [];
    for (let i = firstDay - 1; i >= 0; i--) {
      cells.push({ day: prevDays - i, other: true });
    }
    for (let d = 1; d <= totalDays; d++) {
      cells.push({ day: d, other: false });
    }
    const remainder = cells.length % 7;
    const trailing = remainder === 0 ? 0 : 7 - remainder;
    for (let d = 1; d <= trailing; d++) {
      cells.push({ day: d, other: true });
    }

    const now = new Date();
    const isRealMonth = year === now.getFullYear() && month === now.getMonth() + 1;

    grid.innerHTML = '';
    cells.forEach((cell, idx) => {
      const col = idx % 7;
      const div = document.createElement('div');
      div.className = 'day';
      if (cell.other) div.classList.add('other');
      if (col === 0) div.classList.add('sun');
      if (col === 6) div.classList.add('sat');
      if (!cell.other && isRealMonth && cell.day === now.getDate()) {
        div.classList.add('today');
      }
      const span = document.createElement('span');
      span.className = 'num';
      span.textContent = cell.day;
      div.appendChild(span);
      grid.appendChild(div);
    });
  }

  function renderYear() {
    const year = state.year;
    yearViewDisplay.textContent = year;
    yearInputY.value = year;
    yearScroll.scrollTop = 0;

    const jan1 = new Date(year, 0, 1);
    const startPad = jan1.getDay();
    const cursor = new Date(year, 0, 1 - startPad);

    const dec31 = new Date(year, 11, 31);
    const endPad = 6 - dec31.getDay();
    const endDate = new Date(year, 11, 31 + endPad);

    const totalDays = Math.round((endDate - cursor) / 86400000) + 1;
    const totalRows = totalDays / 7;

    const now = new Date();

    yearGrid.innerHTML = '';
    let d = new Date(cursor);
    for (let r = 0; r < totalRows; r++) {
      const rowDates = [];
      for (let c = 0; c < 7; c++) {
        rowDates.push(new Date(d));
        d.setDate(d.getDate() + 1);
      }
      const monthStart = rowDates.find((dt) => dt.getFullYear() === year && dt.getDate() === 1);
      const monthLabel = monthStart ? String(monthStart.getMonth() + 1) : '';

      const labelCell = document.createElement('div');
      labelCell.className = 'month-label';
      labelCell.textContent = monthLabel;
      if (monthLabel) labelCell.classList.add('row-month-start');
      yearGrid.appendChild(labelCell);

      rowDates.forEach((dt, col) => {
        const div = document.createElement('div');
        div.className = 'day';
        const inYear = dt.getFullYear() === year;
        if (!inYear) div.classList.add('other');
        if (col === 0) div.classList.add('sun');
        if (col === 6) div.classList.add('sat');
        if (
          inYear &&
          dt.getFullYear() === now.getFullYear() &&
          dt.getMonth() === now.getMonth() &&
          dt.getDate() === now.getDate()
        ) {
          div.classList.add('today');
        }
        if (monthLabel) div.classList.add('row-month-start');
        const span = document.createElement('span');
        span.className = 'num';
        span.textContent = dt.getDate();
        div.appendChild(span);
        yearGrid.appendChild(div);
      });
    }
  }

  function renderAll() {
    renderMonth();
    renderYear();
  }

  function goToMonth(year, month) {
    while (month < 1) { month += 12; year -= 1; }
    while (month > 12) { month -= 12; year += 1; }
    state.year = year;
    state.month = month;
    renderAll();
  }

  function goToYear(year) {
    state.year = year;
    renderAll();
  }

  prevBtn.addEventListener('click', () => goToMonth(state.year, state.month - 1));
  nextBtn.addEventListener('click', () => goToMonth(state.year, state.month + 1));
  todayBtn.addEventListener('click', () => {
    const now = new Date();
    goToMonth(now.getFullYear(), now.getMonth() + 1);
  });
  yearInput.addEventListener('change', () => {
    const v = parseInt(yearInput.value, 10);
    if (!Number.isNaN(v) && v > 0) {
      goToMonth(v, state.month);
    } else {
      yearInput.value = state.year;
    }
  });
  monthSelect.addEventListener('change', () => {
    goToMonth(state.year, parseInt(monthSelect.value, 10));
  });

  prevYearBtn.addEventListener('click', () => goToYear(state.year - 1));
  nextYearBtn.addEventListener('click', () => goToYear(state.year + 1));
  thisYearBtn.addEventListener('click', () => goToYear(new Date().getFullYear()));
  yearInputY.addEventListener('change', () => {
    const v = parseInt(yearInputY.value, 10);
    if (!Number.isNaN(v) && v > 0) {
      goToYear(v);
    } else {
      yearInputY.value = state.year;
    }
  });

  setView('month');
  const today = new Date();
  goToMonth(today.getFullYear(), today.getMonth() + 1);
</script>
</body>
</html>
